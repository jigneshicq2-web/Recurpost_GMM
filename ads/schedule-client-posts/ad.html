<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--y:#FFC127;--k:#1F1F1F;--w:#FFFFFF;--bg:#FBF8F1;--line:#ECE6D8;--mut:#D9D3C5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:var(--bg);font-family:Inter,sans-serif;color:var(--k);overflow:hidden}
.ad{position:relative;width:1080px;height:1080px;padding:64px 72px}
.logo{display:block;width:300px;margin:0 auto}
.label{margin-top:44px;text-align:center;font-weight:700;font-size:21px;letter-spacing:.14em}
.label i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--y);margin:0 14px 3px;vertical-align:middle}
h1{margin-top:18px;text-align:center;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:68px;line-height:1.08;letter-spacing:-.025em}
h1 mark{background:linear-gradient(transparent 12%,var(--y) 12%,var(--y) 92%,transparent 92%);color:var(--k);padding:0 10px;border-radius:6px}
.visual{position:absolute;left:72px;right:72px;top:372px;height:470px}
.photo{position:absolute;right:0;top:0;width:580px;height:470px;border-radius:28px;overflow:hidden;background:#EDE6D6 url(person.png) center 35%/cover no-repeat}
.cal{position:absolute;left:0;top:52px;width:540px;background:var(--w);border-radius:22px;padding:22px;box-shadow:0 24px 60px rgba(31,31,31,.14),0 2px 6px rgba(31,31,31,.06)}
.bar{height:10px;border-radius:5px;background:var(--mut)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.av{width:30px;height:30px;border-radius:50%;border:3px solid #fff;margin-left:-10px}
.av:first-child{margin-left:0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{background:#F7F4EC;border-radius:12px;padding:8px 7px;min-height:236px;display:flex;flex-direction:column;gap:7px}
.day .bar{width:55%;height:8px;margin:2px auto 4px;background:#CFC8B8}
.post{background:#fff;border-radius:9px;padding:6px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;flex-direction:column;gap:5px}
.post .th{height:30px;border-radius:6px}
.post .row{display:flex;align-items:center;gap:5px}
.post .dot{width:12px;height:12px;border-radius:50%;flex:none}
.post .ln{height:5px;border-radius:3px;background:#E3DDCF;flex:1}
.post.on{outline:2.5px solid var(--y)}
.chip{position:absolute;left:-14px;top:-12px;background:var(--k);color:#fff;font-weight:800;font-size:19px;letter-spacing:.1em;padding:14px 22px;border-radius:999px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px rgba(31,31,31,.25)}
.chip svg{flex:none}
.bottom{position:absolute;left:72px;right:72px;bottom:64px;display:flex;align-items:center;justify-content:space-between;gap:36px}
.bottom p{font-size:28px;line-height:1.35;font-weight:500;max-width:520px}
.cta{background:var(--y);color:var(--k);font-weight:800;font-size:30px;padding:26px 46px;border-radius:999px;white-space:nowrap;box-shadow:0 10px 24px rgba(255,193,39,.45);display:flex;align-items:center;gap:14px}
</style></head>
<body><div class="ad">
<img class="logo" src="logo.webp" alt="RecurPost">
<div class="label"><i></i>FOR AGENCY OWNERS &amp; SOCIAL MEDIA MANAGERS<i></i></div>
<h1>Still scheduling client posts<br><mark>one by one?</mark></h1>

<div class="visual">
  <div class="photo"></div>
  <div class="cal">
    <div class="chip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFC127" stroke-width="2.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>SCHEDULE CLIENT POSTS</div>
    <div class="top" style="margin-top:34px">
      <div style="display:flex"><span class="av" style="background:#FFC127"></span><span class="av" style="background:#1F1F1F"></span><span class="av" style="background:#7FB3E8"></span><span class="av" style="background:#F2A07B"></span><span class="av" style="background:#8FCFA4"></span></div>
      <div class="bar" style="width:120px;margin-left:8px"></div>
      <div style="flex:1"></div>
      <div class="bar" style="width:46px;background:#EDE7DA"></div><div class="bar" style="width:46px;background:var(--y)"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="bottom">
  <p>Plan and schedule posts for your client accounts from RecurPost.</p>
  <div class="cta">Book a Demo <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
</div>
</div>
<script>
const C=['#FFC127','#1F1F1F','#7FB3E8','#F2A07B','#8FCFA4'];
const T=['#FFE7A8','#D8D4CC','#D3E5F7','#FBDCCB','#D5EFDD'];
const plan=[[0,2,4],[1,3],[2,0,3],[4,1],[3,0,2]];
const g=document.getElementById('grid');
plan.forEach((d,di)=>{const el=document.createElement('div');el.className='day';el.innerHTML='<div class="bar"></div>';
d.forEach((c,pi)=>{const p=document.createElement('div');p.className='post'+(di==2&&pi==0?' on':'');
p.innerHTML=`<div class="th" style="background:${T[c]}"></div><div class="row"><span class="dot" style="background:${C[c]}"></span><span class="ln"></span></div>`;el.appendChild(p)});g.appendChild(el)});
</script>
</body></html>
